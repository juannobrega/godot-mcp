# Deployment for Coolify, which manages Traefik itself.
#
# Coolify generates the proxy labels and the resource network, so none of that
# is declared here — hand-written Traefik labels would fight the ones it adds.
# The domain comes from Coolify: declaring SERVICE_FQDN_GODOT_MCP_8086 makes it
# assign a domain to this service and route it to container port 8086.
#
# The magic variable name is the compose service name uppercased with hyphens
# turned into underscores, plus the port suffix: godot-mcp -> GODOT_MCP_8086.
#
# Two settings are not optional once the server is reachable over a network,
# and the process refuses to start without them:
#
#   GODOT_MCP_WORKSPACE  confines every project path to one directory, so a
#                        client cannot address arbitrary paths on the host
#   MCP_ALLOWED_HOSTS    accepted Host headers, which is what blocks DNS
#                        rebinding from a page in someone's browser
#
# Both are satisfied below without repeating the domain anywhere.

services:
  godot-mcp:
    build:
      context: .
      args:
        # Match the engine your projects are authored in
        GODOT_VERSION: "4.7.2"

    environment:
      # Asks Coolify for a domain and routes it to port 8086 at path /
      SERVICE_FQDN_GODOT_MCP_8086: /

      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8086"
      MCP_HTTP_ENDPOINT: /mcp

      # Traefik forwards the public Host header through, so the domain Coolify
      # assigned is exactly what has to be accepted here
      MCP_ALLOWED_HOSTS: ${SERVICE_FQDN_GODOT_MCP_8086}
      MCP_ALLOWED_ORIGINS: ${SERVICE_URL_GODOT_MCP_8086}

      GODOT_MCP_WORKSPACE: /workspace
      GODOT_MCP_STRICT_PATHS: "true"

      # Leave off in production: Godot's debug paths write temp files into
      # projects and add artificial delays
      GODOT_DEBUG: "false"
      DEBUG: "false"

    volumes:
      # Named so it survives redeploys. This is the only filesystem the tools
      # can reach; see the README for getting projects into it.
      - godot-projects:/workspace

    # Godot writes its own config and import caches under HOME
    tmpfs:
      - /tmp
      - /home/godot

    # Not published to a host interface: Coolify's proxy reaches the container
    # over the network it manages. Publishing would bypass the proxy.
    expose:
      - "8086"

    security_opt:
      - no-new-privileges:true

    # Scene operations spawn a headless engine; give it room but not the host
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  godot-projects:
