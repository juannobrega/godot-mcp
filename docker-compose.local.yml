# Local run, without Coolify or any reverse proxy.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# Then point an MCP client at http://localhost:8086/mcp
#
# The magic SERVICE_FQDN variable means nothing outside Coolify, so the host
# allowlist is set explicitly here instead.

services:
  godot-mcp:
    environment:
      SERVICE_FQDN_GODOT_MCP_8086: ""
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,localhost:8086,127.0.0.1:8086
      MCP_ALLOWED_ORIGINS: http://localhost:8086,http://127.0.0.1:8086
      DEBUG: "true"
    ports:
      - "8086:8086"
    volumes:
      # A real directory, so you can drop projects straight in
      - ./workspace:/workspace
